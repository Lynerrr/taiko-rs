# taiko.rs online server (accounts, lobbies, scores and the website). `docker compose up -d --build` in this folder.
# Accounts are kept in ./data/accounts.json (owned by uid 1000, the deploy user).
services:
  taiko-server:
    build: .
    image: taiko-server
    container_name: taiko-server
    restart: unless-stopped
    user: "1000:1000"
    # Two files per player online (the default 1024 ran out at ~500), and room to grow.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "7800:7800"
      # The same, encrypted: what the game uses (7800 is for builds from before that).
      - "7801:7801"
      # The website (rankings, profiles): only for the German VPS's tunnel, which serves it.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
