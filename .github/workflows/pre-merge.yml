name: Pre-merge

on:
  pull_request:
  merge_group:
  # A push to stable warms the build caches the pull requests start from: a cache saved by a pull
  # request is only seen by that pull request, and without these every run built from nothing.
  # Pull requests into dev read stable's caches too (the default branch's are open to all).
  push:
    branches: [worktree-taiko-client]
  workflow_dispatch:
  # sync-to-dev.yml checks the stable commits it copies onto dev with this.
  workflow_call:
    inputs:
      ref:
        description: The commit or branch to check out instead of the triggering one
        type: string
        default: ""
      linux_only:
        description: Only the Linux desktop job (no Windows, macOS or Android)
        type: boolean
        default: false

# Pull requests into dev also run the Linux desktop job only: dev is the test channel, and its
# release build still compiles every platform after the merge. Pull requests into stable
# (release/* PRs from dev included), merge queue groups, pushes and manual runs keep all four.
# A run called by sync-to-dev.yml reports the caller's event (push), so only linux_only applies.

permissions:
  contents: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HUSKY_DONT_INSTALL_HOOKS: "true"
  RUST_BACKTRACE: "1"

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.linux_only || (github.event_name == 'pull_request' && github.base_ref == 'dev')) && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Saved only from pushes to stable (see `on: push`); pull requests read those.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pre-merge-desktop
          save-if: ${{ github.event_name == 'push' && !inputs.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libasound2-dev libpipewire-0.3-dev

      - name: Build application and test binaries
        run: cargo build --profile ci-test --locked --all-targets

      - name: Lint
        run: cargo clippy --profile ci-test --locked --all-targets -- -D warnings

      # The client regression suite (docs/regression-tests.md) on its own, so a failure is
      # named as one; the full run below skips it.
      - name: Client regression suite
        run: "cargo test --profile ci-test --locked --lib regression::"

      - name: Upload changed golden output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-snapshots-${{ matrix.os }}
          path: src/regression/snapshots/*.snap.new
          if-no-files-found: ignore

      - name: Run prebuilt tests
        run: "cargo test --profile ci-test --locked --all-targets -- --skip regression::"

  android:
    name: Android build
    if: ${{ !inputs.linux_only && !(github.event_name == 'pull_request' && github.base_ref == 'dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The APK's versionCode comes from the commit count.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pre-merge-android
          save-if: ${{ github.event_name == 'push' && !inputs.ref }}

      # A prebuilt binary from cargo-ndk's releases (through cargo-binstall), not a source build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # PRs use the script's debug signing key; release signing secrets are not needed.
      - name: Build APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/android/taiko-rs.apk

  checks:
    name: Pre-merge checks
    if: ${{ always() }}
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          LINUX_ONLY: ${{ (inputs.linux_only || (github.event_name == 'pull_request' && github.base_ref == 'dev')) && 'true' || 'false' }}
        run: |
          # A Linux-only run (sync-to-dev.yml, a pull request into dev) skips Android on purpose.
          if [ "$LINUX_ONLY" = true ] && [ "$ANDROID_RESULT" = skipped ]; then
            ANDROID_RESULT=success
          fi
          if [ "$DESKTOP_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo "Pre-merge checks failed: desktop=$DESKTOP_RESULT, android=$ANDROID_RESULT"
            exit 1
          fi
