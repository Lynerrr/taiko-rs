name: Pre-merge

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HUSKY_DONT_INSTALL_HOOKS: "true"
  RUST_BACKTRACE: "1"

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pre-merge-desktop

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libasound2-dev libpipewire-0.3-dev

      - name: Build application and test binaries
        run: cargo build --profile ci-test --locked --all-targets

      - name: Lint
        run: cargo clippy --profile ci-test --locked --all-targets -- -D warnings

      - name: Run prebuilt tests
        run: cargo test --profile ci-test --locked --all-targets

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: pre-merge-server

      - name: Build application and test binaries
        run: cargo build --profile ci-test --locked --manifest-path server/Cargo.toml --all-targets

      - name: Lint
        run: cargo clippy --profile ci-test --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Run prebuilt tests
        run: cargo test --profile ci-test --locked --manifest-path server/Cargo.toml --all-targets

  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The APK's versionCode comes from the commit count.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pre-merge-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # PRs use the script's debug signing key; release signing secrets are not needed.
      - name: Build APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/android/taiko-rs.apk

  checks:
    name: Pre-merge checks
    if: ${{ always() }}
    needs: [desktop, server, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$DESKTOP_RESULT" != success ] || [ "$SERVER_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo "Pre-merge checks failed: desktop=$DESKTOP_RESULT, server=$SERVER_RESULT, android=$ANDROID_RESULT"
            exit 1
          fi
