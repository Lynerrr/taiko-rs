name: Pre-merge

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HUSKY_DONT_INSTALL_HOOKS: "true"
  RUST_BACKTRACE: "1"

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pre-merge-desktop

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libasound2-dev libpipewire-0.3-dev

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --profile ci-test --locked --all-targets

      - name: Build
        run: cargo build --release --locked

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
          shared-key: pre-merge-server

      - name: Lint
        run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path server/Cargo.toml --all-targets

      - name: Build
        run: cargo build --release --locked --manifest-path server/Cargo.toml

  checks:
    name: Pre-merge checks
    if: ${{ always() }}
    needs: [desktop, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          if [ "$DESKTOP_RESULT" != success ] || [ "$SERVER_RESULT" != success ]; then
            echo "Pre-merge checks failed: desktop=$DESKTOP_RESULT, server=$SERVER_RESULT"
            exit 1
          fi
