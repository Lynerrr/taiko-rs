name: Release build

# Builds taiko.rs for Windows and Linux on every push to the main branch and publishes both as
# the rolling "latest" release, which install.ps1 / install.sh download. Pushes to `dev` publish
# the "dev" pre-release instead (test builds; the game's Build channel setting switches to them).
# Pull requests are checked by pre-merge.yml; packaging and release builds run after merging.
on:
  push:
    branches: [worktree-taiko-client, dev]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The update channel the game is built for (src/update.rs).
  TAIKO_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --profile ci-test --locked --lib

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/taiko-rs.exe dist/
          Copy-Item README.md dist/
          Copy-Item assets/taiko-rs.ico dist/
          Compress-Archive -Path dist/* -DestinationPath taiko-rs-windows-x64.zip

      # windows/installer.iss. The runner image may or may not have Inno Setup (6 or 7).
      - name: Installer
        shell: pwsh
        run: |
          $find = { Get-ChildItem "$env:ProgramFiles\Inno Setup *\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = & $find }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc.FullName /Q "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

          # Install and uninstall it the way a user would, silently.
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\taiko-rs'
          Start-Process .\taiko-rs-windows-x64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (-not (Test-Path "$dir\taiko-rs.exe")) { throw "the installer didn't install taiko-rs.exe" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'taiko-rs.lnk'))) { throw "no Start menu shortcut" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          # The uninstaller finishes from a copy of itself in %TEMP%.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\taiko-rs.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\taiko-rs.exe") { throw "the uninstaller left taiko-rs.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            taiko-rs-windows-x64.zip
            taiko-rs-windows-x64-setup.exe

  linux:
    # The oldest runner whose PipeWire headers the pipewire crate builds against (22.04's 0.3.48
    # is too old). The binary needs its glibc (2.39) or newer: Ubuntu 24.04+, Debian 13+,
    # Fedora 40+, Arch and the like.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libasound2-dev libpipewire-0.3-dev

      - name: Test
        run: cargo test --profile ci-test --locked --lib

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/taiko-rs
          cp target/release/taiko-rs README.md assets/taiko-rs.png dist/taiko-rs/
          strip dist/taiko-rs/taiko-rs
          tar -czf taiko-rs-linux-x64.tar.gz -C dist taiko-rs

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: taiko-rs-linux-x64.tar.gz

  # The APK (android/build-apk.sh). The runner image has the SDK, NDK and a JDK. Signed with the
  # key in the ANDROID_KEYSTORE_BASE64 / _PASS / ANDROID_KEY_ALIAS secrets when they are set (so
  # each build installs over the last); otherwise with a throwaway debug key.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key and won't install over earlier builds"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-apk.sh
          cp target/android/taiko-rs.apk taiko-rs-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: taiko-rs-android.apk

  # install.sh against the archive just built, before anything is published.
  linux-install-check:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install from the build
        run: |
          sudo apt-get update && sudo apt-get install -y libpipewire-0.3-0t64 libasound2t64
          TAIKO_RS_URL="file://$PWD/taiko-rs-linux-x64.tar.gz" sh install.sh --no-launch
          test -x ~/.local/bin/taiko-rs
          test -f ~/.local/share/applications/taiko-rs.desktop
          ~/.local/bin/taiko-rs --help
          sh install.sh --uninstall
          test ! -e ~/.local/bin/taiko-rs

  publish:
    needs: [windows, linux, linux-install-check, android]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/worktree-taiko-client' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/worktree-taiko-client'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Recreate the release so its tag always points at this commit.
          gh release delete latest --yes --cleanup-tag || true
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/worktree-taiko-client"
          notes=$(printf 'Build of %s.\n\nOn Windows: run `taiko-rs-windows-x64-setup.exe`, or install or update from PowerShell:\n```powershell\nirm %s/install.ps1 | iex\n```\n\nOn Linux:\n```sh\ncurl -fsSL %s/install.sh | sh\n```\n\nOn Android (8.0+, 64-bit ARM): install `taiko-rs-android.apk`.' "$GITHUB_SHA" "$raw" "$raw")
          gh release create latest taiko-rs-windows-x64.zip taiko-rs-windows-x64-setup.exe taiko-rs-linux-x64.tar.gz taiko-rs-android.apk --title "taiko.rs (latest build)" --notes "$notes" --target "$GITHUB_SHA"

      - name: Publish "dev" pre-release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/worktree-taiko-client"
          notes=$(printf 'Test build of %s (the `dev` branch); it may be broken.\n\nIn the game: Settings -> Updates -> Build channel: dev, then Update. Or install it directly on Windows (PowerShell):\n```powershell\n$env:TAIKO_RS_CHANNEL="dev"; irm %s/install.ps1 | iex\n```\n\nOn Linux:\n```sh\ncurl -fsSL %s/install.sh | TAIKO_RS_CHANNEL=dev sh\n```' "$GITHUB_SHA" "$raw" "$raw")
          gh release create dev taiko-rs-windows-x64.zip taiko-rs-windows-x64-setup.exe taiko-rs-linux-x64.tar.gz taiko-rs-android.apk --title "taiko.rs (dev build)" --notes "$notes" --target "$GITHUB_SHA" --prerelease --latest=false

  # Runs the same one-line install command users run, on a fresh machine, against the release
  # that was just published.
  install-test:
    needs: publish
    if: github.ref == 'refs/heads/worktree-taiko-client'
    runs-on: windows-latest
    steps:
      - name: Install with the published command
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1 | iex
          Start-Sleep -Seconds 8
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\taiko-rs\taiko-rs.exe'
          if (-not (Test-Path $exe)) { throw "taiko-rs.exe was not installed" }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'taiko-rs.lnk'
          if (-not (Test-Path $link)) { throw "Start menu shortcut is missing" }
          # The game writes its settings on startup, so this proves it launched and found its
          # Windows config directory (the runner has no GPU, so it may exit right after).
          $config = Join-Path $env:APPDATA 'taiko-rs\config.txt'
          if (-not (Test-Path $config)) { throw "taiko.rs did not start (no $config)" }
          Get-Content $config | Select-Object -First 5
          $p = Get-Process taiko-rs -ErrorAction SilentlyContinue
          if ($p) { "taiko.rs is running (pid $($p.Id))"; $p | Stop-Process -Force } else { "taiko.rs started and exited" }

  install-test-linux:
    needs: publish
    if: github.ref == 'refs/heads/worktree-taiko-client'
    runs-on: ubuntu-24.04
    steps:
      - name: Install with the published command
        run: |
          sudo apt-get update && sudo apt-get install -y libpipewire-0.3-0t64 libasound2t64
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | sh -s -- --no-launch
          ~/.local/bin/taiko-rs --help
