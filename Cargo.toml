[package]
name = "taiko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
# Unpacking the Linux release archive in the self-updater (already a dependency of zip).
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
pollster = "1.0.1"
rosu-pp = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6", features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
# The game's rules, apart from the client (crates/taiko-logic).
taiko-logic = { path = "crates/taiko-logic" }
# What the game and its server both speak: the protocols, TLS, languages (crates/taiko-proto).
taiko-proto = { path = "crates/taiko-proto", features = ["client-catalog"] }
# `--recalc-pp` (crates/taiko-recalc).
taiko-recalc = { path = "crates/taiko-recalc" }
# The player's data (`store.rs`): SQLite built into the game, the same on every platform.
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
wgpu = "30"
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Drag and drop on Wayland, which winit 0.30 doesn't do: a data device of our own on winit's
# connection (src/wayland_dnd.rs). The versions winit already uses.
[target.'cfg(target_os = "linux")'.dependencies]
# Checks there's a session bus before the media controls need one (`media::run`).
zbus = "3"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard (Ctrl+C / Ctrl+V, F12 screenshots): Windows, macOS, X11 and Wayland compositors
# with data-control.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }

# Media keys and the desktop's media controls (the music player).
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "android")'.dependencies]
# The APK is a plain NativeActivity (no Java): see android/build-apk.sh.
winit = { version = "0.30", features = ["android-native-activity"] }
libc = "0.2"
# The on-screen keyboard: showing it and taking what's typed, through the Java activity. The
# version winit's android-activity already uses.
jni = "0.22"
# AAudio's low-latency mode (and a real-time audio thread); without it hitsounds lag by tens of ms.
cpal = { version = "0.18", features = ["realtime"] }

# The client and the crates split out of it build, lint and test together: plain `cargo test`
# covers them all. The server and the patched vendor crates stay crates of their own.
[workspace]
members = ["crates/taiko-logic", "crates/taiko-proto", "crates/taiko-recalc"]
default-members = [".", "crates/taiko-logic", "crates/taiko-proto", "crates/taiko-recalc"]
exclude = ["server", "vendor"]

[features]
default = ["pipewire"]
# Native PipeWire output (lower latency than going through the ALSA plugin). Set TAIKO_ALSA=1 to bypass at runtime.
pipewire = ["cpal/pipewire"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Test builds for a phone (`TAIKO_DEV=1 android/build-apk.sh`): near release speed, built far quicker.
[profile.android-dev]
inherits = "release"
lto = "off"
codegen-units = 64
incremental = true

# One profile for CI builds, Clippy, and tests. Keep unwind enabled so normal and test
# targets can share dependencies; omit debug symbols and incremental data on CI runners.
[profile.ci-test]
inherits = "dev"
opt-level = 0
lto = "off"
codegen-units = 256
debug = 0
incremental = false

[profile.ci-test.package."*"]
opt-level = 3

# Reproducible CPU audits: optimized application code without release LTO's build cost.
# One codegen unit, as the release has: with 16, a change anywhere in the game moved generic
# code (the PNG decoder under `skin::load`) between units and made it 30-40 % slower or faster
# on CI's runners, so the perf gate failed pure moves (#409, #414).
[profile.perf-audit]
inherits = "release"
lto = "off"
codegen-units = 1

# Audio decoding is unbearably slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3

# cpal 0.18.2 with one fix: on Windows (WASAPI) it counted the stream latency twice when
# reporting when audio is heard, making the game clock lag the sound. See vendor/cpal/src/host/
# wasapi/stream.rs (`output_timestamp`).
#
# symphonia-bundle-mp3 0.6.1 with one fix: it only took the encoder delay from an MP3's tag for
# encoders it knows by name, where BASS takes it from any. See vendor/symphonia-bundle-mp3/src/
# demuxer.rs (`enc_delay`).
[patch.crates-io]
cpal = { path = "vendor/cpal" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }

# The Windows exe's icon (build.rs).
[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", default-features = false, features = ["parsing"] }

# The client's tests use the crate's test helpers.
[dev-dependencies.taiko-logic]
path = "crates/taiko-logic"
features = ["testing"]

# Each test thread keeps its own language.
[dev-dependencies.taiko-proto]
path = "crates/taiko-proto"
features = ["testing"]

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
