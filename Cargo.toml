[package]
name = "taiko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
# Unpacking the Linux release archive in the self-updater (already a dependency of zip).
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "1.0.1"
rosu-pp = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6", features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
ureq = "3"
wgpu = "30"
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Drag and drop on Wayland, which winit 0.30 doesn't do: a data device of our own on winit's
# connection (src/wayland_dnd.rs). The versions winit already uses.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard (Ctrl+C / Ctrl+V): Windows, macOS, X11 and Wayland compositors with data-control.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
# The APK is a plain NativeActivity (no Java): see android/build-apk.sh.
winit = { version = "0.30", features = ["android-native-activity"] }
libc = "0.2"
# The on-screen keyboard: showing it and taking what's typed, through the Java activity. The
# version winit's android-activity already uses.
jni = "0.22"
# AAudio's low-latency mode (and a real-time audio thread); without it hitsounds lag by tens of ms.
cpal = { version = "0.18", features = ["realtime"] }

[features]
default = ["pipewire"]
# Native PipeWire output (lower latency than going through the ALSA plugin). Set TAIKO_ALSA=1 to bypass at runtime.
pipewire = ["cpal/pipewire"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Audio decoding is unbearably slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3

# cpal 0.18.2 with one fix: on Windows (WASAPI) it counted the stream latency twice when
# reporting when audio is heard, making the game clock lag the sound. See vendor/cpal/src/host/
# wasapi/stream.rs (`output_timestamp`).
[patch.crates-io]
cpal = { path = "vendor/cpal" }
