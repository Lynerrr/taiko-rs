[package]
name = "taiko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6", features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
wgpu = "30"
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
default = ["pipewire"]
# Native PipeWire output (lower latency than going through the ALSA plugin). Set TAIKO_ALSA=1 to bypass at runtime.
pipewire = ["cpal/pipewire"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Audio decoding is unbearably slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3
