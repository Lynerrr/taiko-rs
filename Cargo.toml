[package]
name = "taiko-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
# Unpacking the Linux release archive in the self-updater (already a dependency of zip).
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "1.0.1"
rosu-pp = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6", features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
ureq = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wgpu = "30"
winit = "0.30"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Drag and drop on Wayland, which winit 0.30 doesn't do: a data device of our own on winit's
# connection (src/wayland_dnd.rs). The versions winit already uses.
[target.'cfg(target_os = "linux")'.dependencies]
# Checks there's a session bus before the media controls need one (`media::run`).
zbus = "3"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# The clipboard (Ctrl+C / Ctrl+V, F12 screenshots): Windows, macOS, X11 and Wayland compositors
# with data-control.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }

# Media keys and the desktop's media controls (the music player).
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "android")'.dependencies]
# The APK is a plain NativeActivity (no Java): see android/build-apk.sh.
winit = { version = "0.30", features = ["android-native-activity"] }
libc = "0.2"
# The on-screen keyboard: showing it and taking what's typed, through the Java activity. The
# version winit's android-activity already uses.
jni = "0.22"
# AAudio's low-latency mode (and a real-time audio thread); without it hitsounds lag by tens of ms.
cpal = { version = "0.18", features = ["realtime"] }

[features]
default = ["pipewire"]
# Native PipeWire output (lower latency than going through the ALSA plugin). Set TAIKO_ALSA=1 to bypass at runtime.
pipewire = ["cpal/pipewire"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# CI's tests: release's settings but for what only makes the binary faster, which costs most of
# a build. (The tests take a second; compiling them took minutes.)
[profile.ci-test]
inherits = "release"
opt-level = 0
lto = "off"
codegen-units = 256

[profile.ci-test.package."*"]
opt-level = 3

# Audio decoding is unbearably slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3

# cpal 0.18.2 with one fix: on Windows (WASAPI) it counted the stream latency twice when
# reporting when audio is heard, making the game clock lag the sound. See vendor/cpal/src/host/
# wasapi/stream.rs (`output_timestamp`).
#
# symphonia-bundle-mp3 0.6.1 with one fix: it only took the encoder delay from an MP3's tag for
# encoders it knows by name, where BASS takes it from any. See vendor/symphonia-bundle-mp3/src/
# demuxer.rs (`enc_delay`).
[patch.crates-io]
cpal = { path = "vendor/cpal" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }

# The Windows exe's icon (build.rs).
[build-dependencies]
embed-resource = "3.0.12"
