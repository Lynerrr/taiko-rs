[package]
name = "taiko-proto"
version = "0.1.0"
edition = "2024"
publish = false

# What the game and its server both speak: the multiplayer protocol (`net`), the online
# server's API (`online`), TLS for both (`tls`), the interface's languages (`lang`, `tr!`) and
# the changelog's entries.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The game's 5x7 font (`net` and `online` measure names with it).
taiko-logic = { path = "../taiko-logic" }

[build-dependencies]
toml = { version = "1", optional = true }

[features]
client-catalog = ["dep:toml"]
# For the tests of the crates using this one: each test thread keeps its own language.
testing = []
