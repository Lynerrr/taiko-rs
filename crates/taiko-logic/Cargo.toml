[package]
name = "taiko-logic"
version = "0.1.0"
edition = "2024"
publish = false

# The game's rules with nothing of the client around them: no window, GPU, sound or network.
# Keep it that way (`tests::the_logic_needs_no_window_gpu_sound_or_network`).
[dependencies]
# Defense's rules and acts go over the network as they are.
serde = { version = "1.0.229", features = ["derive"] }
# A .tko map's [Gimmick] section is a line of JSON. A TJA score's chart goes to the server as
# JSON too, and must read back to the very numbers played (float_roundtrip).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Star ratings and pp, as osu! works them out.
rosu-pp = "4"
# .tja charts: Shift-JIS files, and the chart hash leaderboards key by.
encoding_rs = "0.8"
sha2 = "0.10"

[features]
# For the tests of the crates using this one: the helpers its own tests have.
testing = []
