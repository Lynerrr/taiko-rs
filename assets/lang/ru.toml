"Morph: how long the lane takes to bend into the next shape{morph_note}." = "Переход: сколько дорожка изгибается в следующую форму{morph_note}."
"Order: Shuffled gives each map its own order (the same every time you play it); In order goes along the shapes below." = "Порядок: Перемешать даёт каждой карте свой порядок (всегда один и тот же); По порядку идёт по формам ниже."
"Shapes: click or Space to leave one out; Shift + Left/Right moves the selected one earlier or later." = "Формы: клик или Space убирает форму; Shift + влево/вправо двигает выбранную раньше или позже."

