"For every map. Positive brings the notes earlier, so lower it if you hit late. In a song, - / + set that map's own offset on top. Where 0 is depends on the offset scale below." = "Для всех карт. Плюс сдвигает ноты раньше, так что уменьшите, если бьёте поздно. В песне - / + (и O) задают смещение этой карты сверху. Где ноль, зависит от шкалы смещения ниже."
"osu!: 0 is osu!'s, so an osu! universal offset carries over as it is. By sound: 0 is hitting exactly when you hear the note (the audio latency is taken off), and the number is how far ahead of the sound you hit. Switching keeps your timing as it is." = "osu!: ноль как в osu!, так что универсальное смещение оттуда подходит как есть. По звуку: ноль — удар ровно в момент, когда слышите ноту (задержка звука уже учтена), а число — на сколько раньше звука вы бьёте. При переключении тайминг не меняется."
"Enter: hit along to a click track by ear, with no notes to watch; it measures and sets your offset." = "Enter: бейте под метроном на слух, нот на экране нет; игра измерит и выставит смещение."
"Tempo of the calibration click track. Pick one close to the maps you play." = "Темп метронома для калибровки. Выберите близкий к вашим картам."
"While playing, suggest an offset from your recent hits. To apply it with a key, give \"Song: apply offset suggestion\" one in the hotkeys." = "Во время игры подсказывает смещение по последним ударам. Чтобы применять клавишей, назначьте \"Песня: применить подсказку смещения\" в хоткеях."
"On: more hits and a +- margin when your UR is high. Off: plain average of the last 40 hits." = "Вкл: при высоком UR больше ударов и запас +-. Выкл: среднее последних 40 ударов."
"With vsync, notes are drawn where they'll be once the frame is on screen, as with unlimited fps." = "С vsync ноты рисуются там, где будут, когда кадр покажется, как без ограничения FPS."
"Added to the vsync compensation: raise it if you hit late by sight with vsync. Vsync calibration finds it." = "Добавка к компенсации vsync: увеличьте, если с vsync бьёте поздно на глаз. Её находит калибровка vsync."
"Enter: hit notes by sight, sound off, in vsync; it sets the fine tune. Calibrate the offset first." = "Enter: бейте ноты на глаз без звука с vsync; выставит точную настройку. Сначала смещение."
"Countdown before the song continues after the pause menu (0 = at once)." = "Отсчёт перед продолжением после паузы (0 = сразу)."
"Score, accuracy, bars and more during play. Its key (Shift+Tab unless changed below) toggles it in a song." = "Счёт, точность, полосы и прочее в игре. Его клавиша (Shift+Tab, если не изменить) переключает в песне."
"What hiding the interface hides. Enter opens the list; Enter or a click ticks a part on or off." = "Что прячется вместе с интерфейсом. Enter открывает список; Enter или клик отмечает часть."
"Enter, then press the key (with Shift or not) that shows / hides the interface in a song. Delete: none." = "Enter, затем клавиша (можно с Shift), что прячет / показывает интерфейс в песне. Delete: нет."
"Enter, then press the new key (Delete: none, Esc: cancel). Backspace: back to the default." = "Enter, затем новая клавиша (Delete: нет, Esc: отмена). Backspace: по умолчанию."
"Steps through playfield presets anywhere (also in game). Enter, then press a key. Delete: none." = "Листает пресеты поля везде (и в игре). Enter, затем клавиша. Delete: нет."
"Enter, then press the new key, Ctrl / Alt / Shift too (Delete: none, Esc: cancel). Backspace: the default." = "Enter, затем новая клавиша, можно с Ctrl / Alt / Shift (Delete: нет, Esc: отмена). Backspace: исходная."
"The language of menus, settings and messages. Song titles stay as their maps have them." = "Язык меню, настроек и сообщений. Названия песен остаются как в картах."
"Where a screenshot goes: on the clipboard to paste, as a picture in the Screenshots folder, or both." = "Куда идёт скриншот: в буфер обмена, картинкой в папку Screenshots или туда и туда."
"Touch screens: the screen is four columns, left to right (K = rim / kat, D = centre / don)." = "Сенсорный экран: четыре столбца слева направо (K = край / кат, D = центр / дон)."
"Show the playfield's resolution in the bottom-right corner during play." = "Показывать разрешение поля в правом нижнем углу во время игры."
"During play, the mouse wheel makes the playfield bigger or smaller (it always does in its editor)." = "В игре колесо мыши увеличивает или уменьшает поле (в его редакторе всегда)."
"Also list standard maps, converted to taiko like osu! does." = "Показывать и карты standard, переделанные в taiko, как в osu!."
"Group songs under headings you open and close (stars, letters, BPM...). Off: one list in the sort's order; by difficulty, each difficulty on its own." = "Группировать песни под заголовками, которые открываются и закрываются (звёзды, буквы, BPM...). Выкл.: один список по сортировке; по сложности — каждая сложность отдельно."
"Right-click a song to hide it here (files stay). Enter lists them all again." = "Правый клик по песне прячет её здесь (файлы остаются). Enter показывает все снова."
"The folder your maps are in. Enter: browse, type a path, or go back to finding osu!'s." = "Папка с вашими картами. Enter: обзор, ввести путь или снова искать папку osu!."
"Replays, scores, videos, downloaded maps, skins and caches. Enter: move them to another folder or drive." = "Повторы, рекорды, видео, скачанные карты, скины и кэш. Enter: перенести в другую папку или на диск."
"Song select, its mods and the pause menu follow the drum: the rims go up and down, either face picks. In song select Tab moves between the song list and the rows of buttons above and below it, and your drum keys don't type unless the search box is picked." = "Выбор песни, его моды и меню паузы слушаются барабана: края двигают вверх и вниз, центр выбирает. В выборе песни Tab переключает между списком и рядами кнопок сверху и снизу, а клавиши барабана не печатают, пока не выбрано поле поиска."
"Maps draw with the skin images in their own folder. Off: your skin everywhere. Right-click a song to turn one map's off." = "Карты рисуются картинками скина из своей папки. Выкл.: всегда ваш скин. Правый клик по песне выключает скин одной карты."
"The lane the notes scroll on, and the drum's panel, are pure black: no kiai tint, no skin's lane picture." = "Дорожка, по которой едут ноты, и панель барабана полностью чёрные: без подсветки киай и картинки дорожки из скина."
"Notes on the main menu glitch when hit, and the whole screen with them and between menus. Off: they still spin and jump." = "Ноты в главном меню глитчат от удара, а весь экран вместе с ними и при переходе между меню. Выкл.: они всё равно крутятся и подпрыгивают."
"During kiai time, tint the lane and pulse the hit target with the beat. The main menu joins in too." = "В киай подкрашивать дорожку и пульсировать мишень в такт. Главное меню тоже оживает."
".tko maps flash, glitch and tear the screen a quarter as hard, and turn, zoom and move the playfield half as far. Notes are hit at the same moments." = ".tko-карты вспыхивают, глитчат и рвут экран вчетверо слабее, а поворачивают, приближают и двигают поле вдвое меньше. Ноты бьются в те же моменты."
"Some .tko maps draw notes as another colour or size until just before the hit. On: every note shows what it is." = "Некоторые .tko-карты рисуют ноты другим цветом или размером почти до самого удара. Вкл.: каждая нота видна такой, какая она есть."
"When Sudden Death or Perfect fails a play, the map starts over straight away instead of going to the results." = "Когда Sudden Death или Perfect заваливают игру, карта сразу начинается заново, без экрана результатов."
"No flash and no \"GREAT\" on 300s, like skins with an empty hit300: only OKs and misses show." = "Без вспышки и \"GREAT\" на 300, как у скинов с пустым hit300: видны только OK и промахи."
"The coloured glow on the hit target as a note is hit (OKs light it up orange). Off: none." = "Цветное свечение мишени при попадании (на OK — оранжевое). Выкл.: без него."
"Stars out swear words in friends' messages, the global chat and lobby chats." = "Заменяет мат звёздочками в сообщениях друзей, общем чате и чатах лобби."
"A soft chime when a friend messages you (not while you're playing)." = "Тихий звон, когда друг пишет вам (не во время игры)."
"A pop-up when a friend messages you (they still count as unread when off)." = "Всплывашка, когда друг пишет вам (выключено — всё равно считаются непрочитанными)."
"A pop-up when someone says your name in the global chat." = "Всплывашка, когда кто-то называет вас в общем чате."
"A pop-up when someone sends you a friend request." = "Всплывашка, когда вам присылают заявку в друзья."
"A pop-up when a friend comes online." = "Всплывашка, когда друг заходит в сеть."
"A pop-up each time a friend starts a map (click it to watch)." = "Всплывашка, когда друг начинает карту (клик — смотреть)."
"Scales music and hitsounds. Anywhere: hold Alt and scroll the mouse wheel." = "Громкость музыки и хитсаундов. Везде: Alt и колесо мыши."
"How loud the game stays while another window has focus. 100% doesn't change it." = "Насколько громкой остаётся игра, пока активно другое окно. 100% ничего не меняет."
"Left / Right to adjust." = "Влево / вправо — изменить."
"Smaller = less audio latency; raise it if you hear crackling." = "Меньше = меньше задержка звука; увеличьте, если трещит."
"How dark the map background is during play. 100% hides it." = "Насколько тёмен фон карты в игре. 100% прячет его."
"On: in songs the background dims to pure black, and is black when there's none. Off: the interface's grey." = "Вкл: в песне фон темнеет до чёрного и чёрный, если фона нет. Выкл: серый цвет интерфейса."
"Used during songs. vsync is smoothest on Wayland; mailbox/immediate add judder." = "Для песен. На Wayland плавнее всего vsync; mailbox/immediate дёргаются."
"What draws the game: picking one restarts it. If it closes right after starting or crashes, try another: Vulkan or DirectX 12 on Windows (Auto picks DirectX 12). OpenGL always uses vsync on Linux." = "Чем рисуется игра: при выборе она перезапустится. Если она закрывается сразу после запуска или вылетает, попробуй другой: на Windows Vulkan или DirectX 12 (Авто выбирает DirectX 12). OpenGL на Linux всегда с vsync."
"Everything but playing a song uses vsync: song select (and its autoplay preview), settings, results, replays and autoplay." = "Всё, кроме игры, с vsync: выбор песни (и превью автоплея), настройки, итоги, повторы и автоплей."
"Draw at half resolution, scaled up exactly 2x: chunky, crisp pixels and a quarter of the GPU work. For high-DPI screens." = "Рисовать в половинном разрешении и растягивать ровно в 2x: чёткие крупные пиксели, четверть работы GPU."
"mailbox/immediate only. A few times your refresh rate is plenty." = "Только mailbox/immediate. Хватит нескольких частот обновления экрана."
"Frame rate and frame time in the corner. Shortcut: F10." = "Частота и время кадра в углу. Клавиша: F10."
"Menu motion: screen fades, sliding highlights, opening lists, results count-up. Gameplay is unaffected." = "Движение меню: переходы, скользящая подсветка, списки, отсчёт итогов. На игру не влияет."
"The animated intro when taiko.rs starts (any key or click skips it)." = "Анимация при запуске taiko.rs (любая клавиша или клик пропускает)."
"A warning about flashing lights before anything else when taiko.rs starts (any key or click closes it)." = "Предупреждение о мигающем свете в самом начале при запуске taiko.rs (любая клавиша или клик закрывает)."
"Clears the offset each map has of its own, back to just the audio offset. Press twice. They're kept in map_offsets.backup.tsv." = "Убирает оффсеты отдельных карт, остаётся только общий. Нажмите дважды. Копия остаётся в map_offsets.backup.tsv."
"The short guide shown on the first launch." = "Короткая подсказка с первого запуска."
"In fullscreen, the whole game runs at a resolution of your own with black around it. Turning it on goes fullscreen." = "В полном экране вся игра идёт в своём разрешении, а вокруг чёрное. Включение переводит в полный экран."
"Every resolution the monitor reports, custom ones from the graphics driver too, or type your own." = "Все разрешения, что отдаёт монитор, включая кастомные из драйвера. Или введите своё."
"Where the game sits between the sides of the screen: -100 left, 0 the middle, 100 right." = "Где игра стоит по ширине экрана: -100 слева, 0 по центру, 100 справа."
"Where the game sits between the top and the bottom: -100 top, 0 the middle, 100 bottom." = "Где игра стоит по высоте экрана: -100 сверху, 0 по центру, 100 снизу."
"The old layout: straight to song select with tabs along the top, no main menu, and Esc asks to quit." = "Старый вид: сразу выбор песни с вкладками сверху, без главного меню, Esc спрашивает о выходе."
"How faint the song's notes are on the main menu's lane. 100% hides them. The notes drifting behind the menu stay as they are." = "Насколько бледны ноты песни на дорожке главного меню. 100% прячет их. Ноты за меню не меняются."
"The playing song's notes drift along routes behind the main menu, one for each Multiverse universe." = "Ноты играющей песни плывут по маршрутам за главным меню, по одному на вселенную Multiverse."
"Draws notes earlier to make up for display lag; raise it if notes reach the drum after the beat. Judging stays on the audio. In a song: Ctrl + - / +." = "Рисует ноты раньше, чтобы скрыть задержку экрана; увеличьте, если ноты опаздывают. Судит по звуку. В песне: Ctrl + - / +."
"dev: test builds that haven't reached everyone yet (may break). Switch, then Update installs that channel's build." = "dev: тестовые сборки, ещё не для всех (могут сломаться). Переключите, и Обновление поставит сборку канала."
"Enter: look for a newer build, or install it (Ctrl+U in any menu). taiko.rs restarts into it." = "Enter: найти новую сборку или поставить её (Ctrl+U в любом меню). taiko.rs перезапустится."
"Which hand autoplay hits each note with: kddk full / semi alternate, single tap, roll, or ddkk." = "Какой рукой автоигра бьёт каждую ноту: kddk полное / частичное чередование, одной рукой, ролл или ddkk."
"The order autoplay's four keys light the drum in (kddk): 1324 puts each hand's don on the other side." = "Порядок, в котором четыре клавиши автоигры зажигают барабан (kddk): 1324 ставит дон каждой руки на другую сторону."
"Autoplay leads with the left hand instead of the right." = "Автоигра начинает с левой руки, а не с правой."
"Drag the edge between the song list and the map panel. Enter: back to the default." = "Тяните границу между списком песен и панелью карты. Enter: по умолчанию."
"Enter: the latest changes. They also show by themselves after an update." = "Enter: последние изменения. После обновления они показываются сами."
"Look for a newer build each time taiko.rs starts and install it straight away (the game restarts by itself once you're in a menu), and for newer versions of the songs you pick on osu!." = "Искать новую сборку при каждом запуске и сразу ставить её (игра перезапустится сама, когда вы в меню), а также новые версии выбранных песен на osu!."
"Shortcut: F11." = "Клавиша: F11."
"Enter: pick a size (or type one); Left/Right: the next size. Dragging the window's edges works too." = "Enter: выбрать размер (или ввести); влево/вправо: следующий. Можно тянуть края окна."
"After a crash, the next start sends its report to the developers: the build, the system, the graphics card and where it crashed. No account or folder names." = "После вылета следующий запуск отправит отчёт разработчикам: сборку, систему, видеокарту и место вылета. Без имени аккаунта и папок."
"After this long without a key, click or move, menus fade away and the song's disc turns over the blurred background. Anything brings them back." = "Если столько времени не нажимать клавиши и не двигать мышь, меню исчезает и диск песни крутится над размытым фоном. Любое действие всё вернёт."
"Show the map you're playing, your lobby or who you spectate in your Discord status." = "Показывать в статусе Discord карту, лобби или того, кого вы смотрите."
"Enter opens the list. osu! skins from osu!'s or taiko.rs's Skins folder." = "Enter открывает список. Скины osu! из папки Skins osu! или taiko.rs."
"What's drawn from a skin, and which: the skin above, built-in, or any other (mix them). Enter opens the list." = "Что берётся из скина и из какого: скин выше, встроенный или любой другой (можно смешивать). Enter: список."
"Enter: open taiko.rs's Skins folder. Drop .osk files there, then pick them above." = "Enter: открыть папку Skins taiko.rs. Положите туда файлы .osk и выберите выше."
"The interface's accent; any but red tints the greys too. Left/Right: presets (or #rrggbb in the config)." = "Акцент интерфейса; любой, кроме красного, подкрашивает и серые. Влево/вправо: пресеты (или #rrggbb в конфиге)."
"Left/Right: turn the UI colour round the colour wheel, for any colour in between." = "Влево/вправо: крутить цвет интерфейса по цветовому кругу, для любого оттенка."
"Dons' and kats' colours (Multiverse's universes have their own: M in the mod select)." = "Цвета донов и катов (у вселенных Multiverse свои: M в выборе модов)."
"Enter: type a colour like #eb452c. Left/Right turn it round the colour wheel. Makes the colours your own." = "Enter: введите цвет вроде #eb452c. Влево/вправо крутят его по кругу. Цвета станут вашими."
