# src/splash.rs
"WARNING: PHOTOSENSITIVITY" = "ВНИМАНИЕ: ЭПИЛЕПСИЯ"
"This game has flashing lights and fast-changing patterns (in the intro, in mods and in map effects) that may trigger seizures in people with photosensitive epilepsy. If you or anyone in your family has had seizures or epilepsy, talk to a doctor before playing. Stop playing at once if you feel dizzy or sick, or notice blurred vision, eye or muscle twitches, or any movement you don't control." = "В игре есть вспышки света и быстро меняющиеся узоры (в заставке, модах и эффектах карт), которые могут вызвать приступ у людей со светочувствительной эпилепсией. Если у вас или у кого-то из родных были приступы или эпилепсия, перед игрой посоветуйтесь с врачом. Сразу прекратите играть, если почувствуете головокружение или тошноту, заметите размытое зрение, подёргивание глаз или мышц или непроизвольные движения."
"Any key or click to continue" = "Любая клавиша или клик, чтобы продолжить"
"Settings -> System -> Epilepsy warning turns this off" = "Отключается в Настройки -> Система -> Предупреждение об эпилепсии"

