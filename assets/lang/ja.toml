"How fast notes travel. Shortcut: F3 / F4." = "ノーツが流れる速さ。ショートカット: F3 / F4。"
"Enter: edit where gameplay is drawn (drag, its edges, the wheel). In game: drag it about too." = "Enter: プレイを描く範囲を編集 (ドラッグ、端、ホイール)。プレイ中もドラッグで動かせます。"
"Enter: move every part of the interface, add the UR and hit counters, and keep layouts as presets." = "Enter: インターフェースの各パーツを動かし、URと判定のカウンターを追加し、レイアウトをプリセットとして保存します。"
"Enter: make gameplay fill the whole screen again." = "Enter: プレイ画面を再び全画面にします。"
"Enter: pick from a list (grouped by aspect ratio). Left/Right: previous/next." = "Enter: リストから選ぶ (縦横比ごと)。左/右: 前/次。"
"Song speed like DT (1.50x) / HT (0.75x). Song select: [ and ] (Shift = 0.25x steps)." = "DT (1.50x) / HT (0.75x) のような曲の速さ。選曲画面: [ と ] (Shiftで0.25x刻み)。"
"On: music sounds normal, just faster (DT). Off: pitch rises with speed (nightcore)." = "オン: 音程はそのまま速くなる (DT)。オフ: 速さと共に音程も上がる (nightcore)。"
"For every map. Positive brings the notes earlier, so lower it if you hit late. In a song, - / + set that map's own offset on top. Where 0 is depends on the offset scale below." = "全譜面に共通。プラスでノーツが早くなるので、叩くのが遅れるなら下げます。曲中の - / + でその譜面だけのオフセットを足せます。0の位置は下のオフセットの基準で決まります。"
"osu!: 0 is osu!'s, so an osu! universal offset carries over as it is. By sound: 0 is hitting exactly when you hear the note (the audio latency is taken off), and the number is how far ahead of the sound you hit. Switching keeps your timing as it is." = "osu!: 0はosu!と同じなので、osu!のユニバーサルオフセットをそのまま使えます。音基準: 0は音が聞こえた瞬間に叩くこと (音声の遅延は差し引き済み) で、値は音よりどれだけ早く叩くかです。切り替えてもタイミングは変わりません。"
"Enter: hit along to a click track by ear, with no notes to watch; it measures and sets your offset." = "Enter: ノーツなしのクリック音に耳だけで合わせて叩き、オフセットを測って設定します。"
"Tempo of the calibration click track. Pick one close to the maps you play." = "調整用クリック音のテンポ。よく遊ぶ譜面に近いものを選んでください。"
"While playing, suggest an offset from your recent hits. To apply it with a key, give \"Song: apply offset suggestion\" one in the hotkeys." = "プレイ中、最近の叩きからオフセットを提案します。キーで適用するには、ホットキーで「曲: オフセットの提案を適用」に割り当ててください。"
"On: more hits and a +- margin when your UR is high. Off: plain average of the last 40 hits." = "オン: URが高いと多めの叩きと±の幅を使う。オフ: 直近40回の単純な平均。"
"With vsync, notes are drawn where they'll be once the frame is on screen, as with unlimited fps." = "垂直同期でも、FPS無制限と同じくフレームが映る時の位置にノーツを描きます。"
"Added to the vsync compensation: raise it if you hit late by sight with vsync. Vsync calibration finds it." = "垂直同期の補正に足す値。垂直同期で見て叩くと遅れるなら上げます。垂直同期の調整で求まります。"
"Enter: hit notes by sight, sound off, in vsync; it sets the fine tune. Calibrate the offset first." = "Enter: 音なし・垂直同期で見て叩き、微調整を設定します。先にオフセットを調整してください。"
"Countdown before the song continues after the pause menu (0 = at once)." = "ポーズメニューの後、曲が再開するまでのカウントダウン (0 = すぐ)。"
"Score, accuracy, bars and more during play. Its key (Shift+Tab unless changed below) toggles it in a song." = "プレイ中のスコア、精度、バーなど。そのキー (変更しなければShift+Tab) で曲中に切り替えます。"
"What hiding the interface hides. Enter opens the list; Enter or a click ticks a part on or off." = "インターフェースを隠す時に隠すもの。Enterでリスト。Enterかクリックで項目をオン/オフ。"
"Enter, then press the key (with Shift or not) that shows / hides the interface in a song. Delete: none." = "Enterを押してから、曲中にインターフェースを出し入れするキー (Shiftも可) を押す。Delete: なし。"
"Enter, then press the new key (Delete: none, Esc: cancel). Backspace: back to the default." = "Enterを押してから新しいキーを押す (Delete: なし、Esc: 取消)。Backspace: 初期設定に戻す。"
"Steps through playfield presets anywhere (also in game). Enter, then press a key. Delete: none." = "どこでも (プレイ中も) プレイフィールドのプリセットを切り替えます。Enterの後にキー。Delete: なし。"
"Enter, then press the new key, Ctrl / Alt / Shift too (Delete: none, Esc: cancel). Backspace: the default." = "Enterの後に新しいキー (Ctrl / Alt / Shiftも可)。Delete: なし、Esc: 取消。Backspace: 初期設定。"
"The language of menus, settings and messages. Song titles stay as their maps have them." = "メニュー、設定、メッセージの言語。曲名は譜面のままです。"
"Where a screenshot goes: on the clipboard to paste, as a picture in the Screenshots folder, or both." = "スクリーンショットの行き先: 貼り付け用のクリップボード、Screenshotsフォルダの画像、またはその両方。"
"Touch screens: the screen is four columns, left to right (K = rim / kat, D = centre / don)." = "タッチ画面: 画面を左から4列に分けます (K = ふち / カッ、D = 面 / ドン)。"
"Show the playfield's resolution in the bottom-right corner during play." = "プレイ中、右下にプレイフィールドの解像度を表示します。"
"During play, the mouse wheel makes the playfield bigger or smaller (it always does in its editor)." = "プレイ中、マウスホイールでプレイフィールドを拡大・縮小します (エディタでは常に)。"
"Also list standard maps, converted to taiko like osu! does." = "standardの譜面も、osu!と同じく太鼓に変換して並べます。"
"Group songs under headings you open and close (stars, letters, BPM...). Off: one list in the sort's order; by difficulty, each difficulty on its own." = "曲を開閉できる見出し (星、頭文字、BPMなど) ごとにまとめます。オフ: 並び順のまま一つのリストに。難易度順では難易度ごとに並べます。"
"Right-click a song to hide it here (files stay). Enter lists them all again." = "曲を右クリックでここから隠せます (ファイルは残ります)。Enterで全て再表示。"
"The folder your maps are in. Enter: browse, type a path, or go back to finding osu!'s." = "譜面のあるフォルダ。Enter: 参照、パスを入力、またはosu!のものを探すに戻す。"
"Replays, scores, videos, downloaded maps, skins and caches. Enter: move them to another folder or drive." = "リプレイ、スコア、動画、ダウンロードした譜面、スキン、キャッシュ。Enter: 別のフォルダやドライブへ移動。"
"Song select, its mods and the pause menu follow the drum: the rims go up and down, either face picks. In song select Tab moves between the song list and the rows of buttons above and below it, and your drum keys don't type unless the search box is picked." = "選曲、Mod選択、ポーズメニューを太鼓で操作します。フチで上下、面で決定。選曲ではTabで曲リストと上下のボタン列を移動します。検索欄を選んでいない間、太鼓のキーは文字を入力しません。"
"Maps draw with the skin images in their own folder. Off: your skin everywhere. Right-click a song to turn one map's off." = "譜面のフォルダにあるスキン画像で描きます。オフ: 常に自分のスキン。曲を右クリックでその譜面だけオフ。"
"The lane the notes scroll on, and the drum's panel, are pure black: no kiai tint, no skin's lane picture." = "ノーツが流れるレーンと太鼓のパネルを真っ黒に。キアイの色もスキンのレーン画像もなし。"
"Notes on the main menu glitch when hit, and the whole screen with them and between menus. Off: they still spin and jump." = "メインメニューのノーツが叩くとグリッチし、画面全体もそのときとメニューの切り替えでグリッチします。オフでも回って跳ねます。"
"During kiai time, tint the lane and pulse the hit target with the beat. The main menu joins in too." = "キアイタイム中、レーンに色を付け、判定枠を拍に合わせて脈打たせます。メインメニューも盛り上がります。"
".tko maps flash, glitch and tear the screen a quarter as hard, and turn, zoom and move the playfield half as far. Notes are hit at the same moments." = ".tko譜面のフラッシュ、グリッチ、画面の乱れを4分の1に、プレイフィールドの回転、ズーム、移動を半分にします。ノーツを叩くタイミングは変わりません。"
"Some .tko maps draw notes as another colour or size until just before the hit. On: every note shows what it is." = "一部の.tko譜面は叩く直前までノーツを別の色や大きさで描きます。オン: すべてのノーツが本当の姿で表示されます。"
"When Sudden Death or Perfect fails a play, the map starts over straight away instead of going to the results." = "Sudden DeathやPerfectで失敗したとき、リザルトに行かずすぐに最初からやり直します。"
"No flash and no \"GREAT\" on 300s, like skins with an empty hit300: only OKs and misses show." = "300で光らず\"GREAT\"も出しません (空のhit300のスキンと同じ)。OKとミスだけが出ます。"
"The coloured glow on the hit target as a note is hit (OKs light it up orange). Off: none." = "ノーツを叩いたときの判定枠の色付きの光 (OKはオレンジ)。オフ: 光りません。"
"Stars out swear words in friends' messages, the global chat and lobby chats." = "フレンドのメッセージ、全体チャット、ロビーのチャットの悪口を伏せ字にします。"
"A soft chime when a friend messages you (not while you're playing)." = "フレンドからメッセージが届くと小さく鳴ります (プレイ中は鳴りません)。"
"A pop-up when a friend messages you (they still count as unread when off)." = "フレンドからメッセージが届くとポップアップ (オフでも未読として数えます)。"
"A pop-up when someone says your name in the global chat." = "全体チャットで誰かがあなたの名前を出すとポップアップ。"
"A pop-up when someone sends you a friend request." = "フレンド申請が届くとポップアップ。"
"A pop-up when a friend comes online." = "フレンドがログインするとポップアップ。"
"A pop-up each time a friend starts a map (click it to watch)." = "フレンドが譜面を始めるたびにポップアップ (クリックで観戦)。"
"Scales music and hitsounds. Anywhere: hold Alt and scroll the mouse wheel." = "音楽とヒット音の音量。どこでも: Altを押しながらマウスホイール。"
"How loud the game stays while another window has focus. 100% doesn't change it." = "別のウィンドウを使っている間の音量です。100%で変わりません。"
"Left / Right to adjust." = "左 / 右で調整。"
"Smaller = less audio latency; raise it if you hear crackling." = "小さいほど音の遅延が少ない。ノイズが聞こえたら上げます。"
"How dark the map background is during play. 100% hides it." = "プレイ中の譜面の背景の暗さ。100%で見えなくなります。"
"On: in songs the background dims to pure black, and is black when there's none. Off: the interface's grey." = "オン: 曲中の背景は真っ黒まで暗くなり、背景がなければ黒。オフ: インターフェースの灰色。"
"Used during songs. vsync is smoothest on Wayland; mailbox/immediate add judder." = "曲中に使います。Waylandではvsyncが一番なめらか。mailbox/immediateはカクつきます。"
"What draws the game: picking one restarts it. If it closes right after starting or crashes, try another: Vulkan or DirectX 12 on Windows (Auto picks DirectX 12). OpenGL always uses vsync on Linux." = "ゲームを描くグラフィックスAPI: 選ぶと再起動します。起動直後に閉じたりクラッシュしたら別のものを: WindowsならVulkanかDirectX 12 (自動ではDirectX 12)。LinuxのOpenGLは常に垂直同期です。"
"Everything but playing a song uses vsync: song select (and its autoplay preview), settings, results, replays and autoplay." = "曲のプレイ以外は垂直同期: 選曲 (とオートのプレビュー)、設定、リザルト、リプレイ、オート。"
"Draw at half resolution, scaled up exactly 2x: chunky, crisp pixels and a quarter of the GPU work. For high-DPI screens." = "半分の解像度で描き、ちょうど2倍に拡大: くっきり大きな画素、GPUの負荷は1/4。高DPIの画面向け。"
"mailbox/immediate only. A few times your refresh rate is plenty." = "mailbox/immediateのみ。リフレッシュレートの数倍で十分です。"
"Frame rate and frame time in the corner. Shortcut: F10." = "隅にフレームレートとフレーム時間。ショートカット: F10。"
"Menu motion: screen fades, sliding highlights, opening lists, results count-up. Gameplay is unaffected." = "メニューの動き: 画面のフェード、ハイライトの移動、リストの開閉、リザルトのカウント。プレイは変わりません。"
"The animated intro when taiko.rs starts (any key or click skips it)." = "taiko.rs起動時のアニメーション (キーかクリックで飛ばせます)。"
"A warning about flashing lights before anything else when taiko.rs starts (any key or click closes it)." = "taiko.rs起動時に最初に出る、点滅する光についての注意 (キーかクリックで閉じます)。"
"Clears the offset each map has of its own, back to just the audio offset. Press twice. They're kept in map_offsets.backup.tsv." = "譜面ごとのオフセットを消して、全体のオフセットだけに戻します。2回押してください。map_offsets.backup.tsvに残ります。"
"The short guide shown on the first launch." = "初回起動時の短いガイドをもう一度表示します。"
"In fullscreen, the whole game runs at a resolution of your own with black around it. Turning it on goes fullscreen." = "フルスクリーンで、ゲーム全体を好きな解像度で動かし、周りを黒くします。オンにするとフルスクリーンになります。"
"Every resolution the monitor reports, custom ones from the graphics driver too, or type your own." = "モニターが報告するすべての解像度 (ドライバーで追加したものも含む)。自分で入力もできます。"
"Where the game sits between the sides of the screen: -100 left, 0 the middle, 100 right." = "画面の左右のどこに置くか: -100 左、0 中央、100 右。"
"Where the game sits between the top and the bottom: -100 top, 0 the middle, 100 bottom." = "画面の上下のどこに置くか: -100 上、0 中央、100 下。"
"The old layout: straight to song select with tabs along the top, no main menu, and Esc asks to quit." = "旧レイアウト: メインメニューなしですぐ選曲画面になり、上にタブが並び、Escは終了を確認します。"
"How faint the song's notes are on the main menu's lane. 100% hides them. The notes drifting behind the menu stay as they are." = "メインメニューのレーンを流れる曲のノーツの薄さ。100%で見えなくなります。背景を流れるノーツは変わりません。"
"The playing song's notes drift along routes behind the main menu, one for each Multiverse universe." = "再生中の曲のノーツが、Multiverseのユニバースごとの道筋を流れていきます。"
"Draws notes earlier to make up for display lag; raise it if notes reach the drum after the beat. Judging stays on the audio. In a song: Ctrl + - / +." = "画面の遅れを補うためノーツを早めに描きます。拍より遅れて届くなら上げます。判定は音のまま。曲中: Ctrl + - / +。"
"dev: test builds that haven't reached everyone yet (may break). Switch, then Update installs that channel's build." = "dev: まだ全員に届いていない試験ビルド (壊れるかも)。切り替えてからアップデートでそのビルドを入れます。"
"Enter: look for a newer build, or install it (Ctrl+U in any menu). taiko.rs restarts into it." = "Enter: 新しいビルドを探す、または入れる (どのメニューでもCtrl+U)。taiko.rsが再起動します。"
"Which hand autoplay hits each note with: kddk full / semi alternate, single tap, roll, or ddkk." = "オートプレイが各ノーツをどちらの手で叩くか: kddkのフル/セミ交互、片手、ロール、ddkk。"
"The order autoplay's four keys light the drum in (kddk): 1324 puts each hand's don on the other side." = "オートプレイの4つのキーが太鼓を光らせる順番 (kddk): 1324は各手のドンを反対側にします。"
"Autoplay leads with the left hand instead of the right." = "オートプレイが右手ではなく左手から叩きます。"
"Drag the edge between the song list and the map panel. Enter: back to the default." = "曲リストと譜面パネルの間の境目をドラッグ。Enter: 初期設定に戻す。"
"Enter: the latest changes. They also show by themselves after an update." = "Enter: 最新の変更点。アップデート後にも自動で表示されます。"
"Look for a newer build each time taiko.rs starts and install it straight away (the game restarts by itself once you're in a menu), and for newer versions of the songs you pick on osu!." = "起動のたびに新しいビルドを探してすぐに入れ (メニューにいるときに自動で再起動します)、選んだ曲のosu!での新しい版も探します。"
"Shortcut: F11." = "ショートカット: F11。"
"Enter: pick a size (or type one); Left/Right: the next size. Dragging the window's edges works too." = "Enter: サイズを選ぶ (入力も可)。左/右: 次のサイズ。ウィンドウの端のドラッグでも変えられます。"
"After a crash, the next start sends its report to the developers: the build, the system, the graphics card and where it crashed. No account or folder names." = "クラッシュしたら、次の起動時にレポートを開発者に送ります: ビルド、システム、グラフィックカード、落ちた場所。アカウント名やフォルダ名は含みません。"
"After this long without a key, click or move, menus fade away and the song's disc turns over the blurred background. Anything brings them back." = "この時間キー・クリック・マウス操作がないと、メニューが消えてぼかした背景の上で曲のディスクが回ります。何か操作すれば戻ります。"
"Show the map you're playing, your lobby or who you spectate in your Discord status." = "Discordのステータスに、プレイ中の譜面、ロビー、観戦相手を表示します。"
"Enter opens the list. osu! skins from osu!'s or taiko.rs's Skins folder." = "Enterでリスト。osu!かtaiko.rsのSkinsフォルダにあるosu!のスキン。"
"What's drawn from a skin, and which: the skin above, built-in, or any other (mix them). Enter opens the list." = "スキンから描くものとその出どころ: 上のスキン、内蔵、または他のどれか (混ぜられます)。Enterでリスト。"
"Enter: open taiko.rs's Skins folder. Drop .osk files there, then pick them above." = "Enter: taiko.rsのSkinsフォルダを開く。.oskファイルを置いて、上で選びます。"
"The interface's accent; any but red tints the greys too. Left/Right: presets (or #rrggbb in the config)." = "インターフェースのアクセント色。赤以外は灰色にも色が付きます。左/右: プリセット (設定ファイルで#rrggbbも可)。"
"Left/Right: turn the UI colour round the colour wheel, for any colour in between." = "左/右: UIの色を色相環で回し、間のどんな色にもできます。"
"Dons' and kats' colours (Multiverse's universes have their own: M in the mod select)." = "ドンとカッの色 (Multiverseの宇宙にはそれぞれの色: Mod選択でM)。"
"Enter: type a colour like #eb452c. Left/Right turn it round the colour wheel. Makes the colours your own." = "Enter: #eb452cのように色を入力。左/右で色相環を回します。自分だけの色になります。"
