"Far off, the notes crawl through each step, then rush the rest of the way at its end. Closer in they move as usual, so each one is in the hit circle on time. A shorter step rushes more often." = "遠くのノーツは各ステップでゆっくり進み、終わりに一気に残りを進みます。近づくといつも通りに動くので、どのノーツも時間通りに判定円に来ます。短いほど頻繁に加速します。"

