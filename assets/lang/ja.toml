# src/splash.rs
"WARNING: PHOTOSENSITIVITY" = "注意: 光過敏性発作"
"This game has flashing lights and fast-changing patterns (in the intro, in mods and in map effects) that may trigger seizures in people with photosensitive epilepsy. If you or anyone in your family has had seizures or epilepsy, talk to a doctor before playing. Stop playing at once if you feel dizzy or sick, or notice blurred vision, eye or muscle twitches, or any movement you don't control." = "このゲームには、光の点滅や急速に変化する模様(起動画面、Mod、譜面のエフェクト)が含まれており、光過敏性てんかんの方に発作を引き起こす可能性があります。ご本人やご家族に発作やてんかんの経験がある場合は、プレイ前に医師にご相談ください。めまいや気分の悪さ、視覚の異常、目や筋肉のけいれん、意識しない体の動きを感じたら、すぐにプレイを中止してください。"
"Any key or click to continue" = "キーかクリックで続ける"
"Settings -> System -> Epilepsy warning turns this off" = "設定 -> システム -> 光過敏性発作の注意 でオフにできます"

